[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "great-adventure"
version = "0.2.0"
description = "Helpers for The Great Adventure Claude Code plugin"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
posters = ["google-genai>=1.0"]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
adventure = "adventure.__main__:main"

[tool.setuptools]
packages = ["adventure"]
