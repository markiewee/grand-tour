[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grandtour"
version = "0.1.0"
description = "Helpers for the Grand Tour Claude Code plugin"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
posters = ["google-genai>=1.0"]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
grandtour = "grandtour.__main__:main"

[tool.setuptools]
packages = ["grandtour"]
