<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journey" data-j="title" data-j-attr="content">
<!-- ga:meta -->
<title>The Paper Road</title>
<meta name="description" content="Ten envelopes across four days, Singapore to Osaka to Kyoto, each one sealed until you are standing in the right place or its hour comes round.">
<meta property="og:title" content="The Paper Road">
<meta property="og:description" content="Ten envelopes across four days, Singapore to Osaka to Kyoto, each one sealed until you are standing in the right place or its hour comes round.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex, nofollow">
<!-- /ga:meta -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/journey.css">
<script>
  /* The browser chrome cannot read a var(), so the theme's night is copied into the meta tag
     once the stylesheets above have loaded. The literal in the tag is only the first paint. */
  { const n = getComputedStyle(document.documentElement).getPropertyValue('--night').trim();
    if (n) document.querySelector('meta[name="theme-color"]').content = n; }
</script>
</head>
<body>
<div class="device" id="device">
  <canvas id="sky" aria-hidden="true"></canvas>
  <!-- only on a journey marked as a demo, see js/demo.js -->
  <nav class="demo-bar" id="demoBar" aria-label="Skip through this demo" hidden></nav>

  <!-- 1 · the first time it is opened -->
  <section id="welcome" class="scene" aria-label="Welcome">
    <div class="lbl gold" data-j="subtitle"></div>
    <h1 data-j="title"></h1>
    <p data-j="opening"></p>
    <button class="btn gold-btn" id="startBtn" data-t="start"></button>
    <button class="geo" id="geoBtn" aria-pressed="false" data-t="geo"></button>
    <p class="small" id="a2hs">Add it to your Home Screen first, so it still works where there is no signal.</p>
  </section>

  <!-- 2 · the sky -->
  <section id="home" class="scene" aria-label="The sky">
    <div class="top"><span class="brand" id="brand" data-j="title"></span><span class="lbl mist when" id="homeWhen"></span></div>
    <div class="count" id="count"></div>
    <svg id="route" viewBox="0 0 390 520" preserveAspectRatio="xMidYMid meet" aria-label="The route">
      <defs id="routeDefs"></defs>
      <path class="road" id="road" d=""></path>
      <path class="done" id="roadDone" d=""></path>
      <g id="routeLabels"></g>
      <g id="stops"></g>
    </svg>
    <div class="sheet" id="sheet">
      <div class="grip"></div>
      <div class="row"><div class="mini-env" id="sheetEnv"></div>
        <div><div class="lbl red" id="sheetLbl"></div><div class="t1" id="sheetPlace"></div><div class="t2" id="sheetSub"></div></div>
      </div>
      <button class="btn" id="openBtn" data-t="open"></button>
    </div>
  </section>

  <!-- 3 · sealed -->
  <section id="env" class="scene" aria-label="Sealed envelope">
    <button class="back" id="envBack">Sky</button>
    <div class="env-head" id="envHead"><div class="lbl gold" id="envLbl"></div><h2 id="envPlace"></h2></div>
    <div class="stage" id="stage">
      <div class="tilt" id="tilt">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="glow-in" id="glowIn"></div>
        <div class="letter-wrap" id="letterWrap">
          <div class="letter" id="letter">
            <div class="lp mid"><div class="face in"></div></div>
            <div class="lp bot" id="lpBot"><div class="face in"><div class="shade"></div></div><div class="face out"><div class="shade"></div></div></div>
            <div class="lp top" id="lpTop"><div class="face in"><div class="shade"></div></div><div class="face out"><span class="mono">L · R</span><div class="shade"></div></div></div>
          </div>
        </div>
        <div class="env-front"></div>
        <div class="flapshadow" id="flapShadow"></div>
        <div class="flap" id="flap"><div class="face front"></div><div class="face back"></div></div>
        <div class="seal" id="seal" role="button" tabindex="0" aria-label="Press and hold to open">
          <div class="aura" id="aura"></div>
          <div class="half l" id="halfL"></div>
          <div class="half r" id="halfR"></div>
          <svg class="crack" id="crack" viewBox="0 0 100 100"><polyline points="52,0 47,30 56,52 46,74 51,100" fill="none" stroke="color-mix(in srgb, var(--gold-soft) 68%, white)" stroke-width="2.4" stroke-linejoin="round" style="filter: drop-shadow(0 0 4px var(--gold-soft))"/></svg>
          <svg class="ring" viewBox="0 0 128 128"><circle class="track" cx="64" cy="64" r="60"/><circle id="ringFill" cx="64" cy="64" r="60" transform="rotate(-90 64 64)"/></svg>
        </div>
      </div>
      </div>
    </div>
    <div id="letterStage"></div>
    <div class="env-hint" id="hint"><div class="lbl gold2" id="hintLbl" data-t="sealHint"></div><p id="hintSub"></p></div>
  </section>

  <!-- 4, 5 · inside the envelope -->
  <section id="stop" class="scene" aria-label="Inside the envelope">
    <div class="inner">
      <button class="back" id="stopBack">Sky</button>
      <div class="press" id="press">
        <img data-plate="mist" alt=""><img data-plate="jade" alt=""><img data-plate="gold" alt=""><img data-plate="red" alt=""><img data-plate="ink" alt="">
        <img class="final" id="finalPoster" alt="">
        <div class="grain" data-grain style="opacity:.35"></div>
      </div>
      <div class="plates" id="chips">
        <span class="chip" data-chip="mist"></span><span class="chip" data-chip="jade"></span><span class="chip" data-chip="gold"></span><span class="chip" data-chip="red"></span><span class="chip" data-chip="ink"></span>
      </div>
      <div class="plate-lbl lbl red" id="plateLbl">&nbsp;</div>
      <div class="content">
        <div class="reveal lbl red" id="stopLbl" style="text-align:center"></div>
        <h3 class="reveal" id="stopPlace"></h3>
        <p class="reveal lede" id="stopLede"></p>
        <p class="reveal caption" id="stopCaption"></p>
        <div class="reveal q" id="q">
          <div class="lbl gold" data-t="question"></div>
          <div class="qt" id="qText"></div>
          <div id="qAsk"><textarea id="answer" rows="3" aria-label="Your answer" data-t="answerPlaceholder" data-t-attr="placeholder"></textarea>
            <button class="btn" id="sendBtn" data-t="send"></button></div>
          <div id="qDone" hidden><p class="answered" id="qAnswer"></p><div class="answered-note" data-t="sent"></div></div>
        </div>
        <div class="reveal after-stop" id="afterStop"><button class="btn" id="doneBtn" data-t="back"></button></div>
      </div>
    </div>
  </section>

  <!-- 7 · midnight -->
  <section id="midnight" class="scene" aria-label="Midnight letters">
    <div class="mid-head"><div class="lbl gold2" id="midLbl" data-j="midnight.dayLabel"></div></div>
    <div class="mid-body"><div class="clock">00:00</div><h2 id="midTitle" data-j="midnight.title"></h2><p class="sub" id="midSub"></p></div>
    <div id="falls"></div>
    <div class="mid-foot"><button class="btn" id="midDone" data-t="back"></button></div>
  </section>

  <!-- 10 · the book -->
  <section id="book" class="scene" aria-label="The book">
    <button class="back" id="bookBack">Sky</button>
    <div class="pages" id="pages"></div>
    <div class="book-bar"><button class="btn" id="printBtn" data-t="print"></button></div>
  </section>

  <div class="fly" id="fly"></div>
  <div class="toast" id="toast"><div class="lbl gold" id="toastLbl" data-t="toastLabel"></div><p id="toastText" data-t="toastText"></p></div>
  <div class="peek" id="peek"></div>
  <div class="memo" id="memo"><div class="scrim" id="memoScrim"></div>
    <div class="memo-card" id="memoCard" role="dialog" aria-modal="true"><img class="thumb" id="memoThumb" alt=""><div class="lbl red" id="memoWhen"></div><h3 id="memoPlace"></h3>
      <div class="memo-q" id="memoQ"></div><p class="memo-a" id="memoA"></p><div id="memoMedia"></div><div class="lbl mist" id="memoHint" data-t="memoHint"></div></div></div>
</div>
<div class="desk-note"><b data-j="title"></b><br><span data-t="desk"></span></div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/Physics2DPlugin.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
