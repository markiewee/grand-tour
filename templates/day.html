<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day $day_number · $title</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Poiret+One&family=Josefin+Sans:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="guide.css">
</head>
<body>
<section class="page opener">
  <div class="rh"><span>$title</span><span><b>Day $day_number</b> &middot; $date</span></div>
  <div class="poster frame">
    <img src="$poster" alt="$poster_alt">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
  </div>
  <div class="title">
    <div class="day"><small>Day</small>$day_number</div>
    <div><h1>$title</h1><div class="sub">$caption</div></div>
    <div class="wx"></div>
  </div>
  <div class="rf"><span>$caption</span><span>1</span></div>
</section>
<section class="page inner">
  <div class="rh"><span>$title &middot; <b>Day $day_number</b></span><span>$date</span></div>
  <div class="chap"><h2>The day</h2></div>
  <div class="rows">
$rows
  </div>
  <div class="divider"></div>
  <div class="hist"><b>History</b>$history</div>
  <div class="rf"><span>$caption</span><span>2</span></div>
</section>
</body>
</html>
