name: test
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,themes]"
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Map and copy binding checks
        working-directory: templates/journey
        run: node --test qa/*.test.mjs
